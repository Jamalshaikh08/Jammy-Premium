<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAMMY MUSIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b0f;color:white;font-family:Arial;padding-bottom:130px}
header{background:#121820;padding:20px;position:sticky;top:0;z-index:3}
.logo{font-size:26px;font-weight:bold;color:#1ed760}
main{padding:18px}
input{width:100%;padding:14px;border:0;border-radius:25px;background:#252a33;color:white;font-size:16px;margin:12px 0}
button{border:0;border-radius:22px;padding:10px 14px;background:#1ed760;color:#000;font-weight:bold;margin:4px}
.hero{padding:18px;border-radius:16px;background:linear-gradient(135deg,#176b40,#17202b)}
.sub,small{color:#aaa}
#results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:#1b2028;border-radius:14px;padding:10px;overflow:hidden}
.card img{width:100%;border-radius:10px}
.card p{font-size:14px;font-weight:bold}
.card small{display:block;margin-bottom:8px}
.card button{font-size:12px}
#message{color:#bbb;margin:15px 0}
.player{position:fixed;bottom:0;left:0;right:0;background:#202630;padding:12px;z-index:5}
.controls{display:flex;justify-content:center;gap:8px}
.player audio{width:100%;height:35px}
.fav{background:#ff5277;color:white}
</style>
</head>
<body>
<header><div class="logo">🎧 JAMMY MUSIC</div></header>
<main>
<section class="hero">
<h2>Your music. Your vibe. 💚</h2>
<p class="sub">Discover music and save your favourites.</p>
</section>

<h3>🇵🇰 Pakistani Artists</h3>
<button onclick="quick('Talha Yunus')">Talha Yunus</button>
<button onclick="quick('Talha Anjum')">Talha Anjum</button>
<button onclick="quick('Atif Aslam')">Atif Aslam</button>
<button onclick="quick('Young Stunners')">Young Stunners</button>
<button onclick="quick('Hasan Raheem')">Hasan Raheem</button>

<h3>🔎 Search Music</h3>
<input id="search" placeholder="Song ya singer ka naam likho...">
<button onclick="findMusic()">Search Music</button>
<button onclick="showFavourites()">❤️ My Library</button>
<h3 id="heading">🎵 Discover Music</h3>
<div id="message">Apna favourite artist search karo!</div>
<div id="results"></div>
</main>

<div class="player">
<div id="now">JAMMY MUSIC — Select a song</div>
<div class="controls">
<button onclick="previousSong()">⏮ Previous</button>
<button onclick="togglePlay()" id="playBtn">▶ Play/Pause</button>
<button onclick="nextSong()">Next ⏭</button>
</div>
<audio id="audio" controls></audio>
</div>

<script>
const search=document.getElementById('search');
const results=document.getElementById('results');
const message=document.getElementById('message');
const audio=document.getElementById('audio');
const now=document.getElementById('now');
let songs=[],current=-1,libraryMode=false;
let favourites=JSON.parse(localStorage.getItem('jammyFavs')||'[]');

function quick(name){
 search.value=name;
 findMusic();
}

async function findMusic(){
 const term=search.value.trim();
 if(!term){message.textContent='Song ya singer ka naam likho.';return;}
 libraryMode=false;
 document.getElementById('heading').textContent='🎵 Search Results';
 results.innerHTML='';
 message.textContent='Online songs search ho rahe hain...';
 try{
  const url='https://itunes.apple.com/search?term='+encodeURIComponent(term)+'&entity=song&limit=30';
  const response=await fetch(url);
  if(!response.ok)throw Error();
  const data=await response.json();
  songs=data.results||[];
  current=-1;
  renderSongs(songs);
 }catch(e){
  message.textContent='Internet check karo aur dobara try karo.';
 }
}

function renderSongs(list){
 results.innerHTML='';
 if(!list.length){message.textContent='Koi song nahi mila.';return;}
 message.textContent=list.length+' songs mile!';
 list.forEach(song=>{
  const card=document.createElement('div');
  card.className='card';
  const img=document.createElement('img');
  img.src=song.artworkUrl100||'';
  img.alt='Album cover';
  const title=document.createElement('p');
  title.textContent=song.trackName||'Unknown song';
  const artist=document.createElement('small');
  artist.textContent=song.artistName||'Unknown artist';
  const play=document.createElement('button');
  play.textContent=song.previewUrl?'▶ Play Preview':'No Preview';
  play.disabled=!song.previewUrl;
  play.onclick=()=>playSong(song);
  const fav=document.createElement('button');
  fav.className='fav';
  fav.textContent=favourites.some(x=>x.trackId===song.trackId)?'❤️ Saved':'♡ Favourite';
  fav.onclick=()=>toggleFavourite(song);
  card.append(img,title,artist,play,fav);
  results.appendChild(card);
 });
}

function playSong(song){
 if(!song.previewUrl){message.textContent='Is song ka preview available nahi.';return;}
 current=songs.findIndex(x=>x.trackId===song.trackId);
 audio.src=song.previewUrl;
 now.textContent=song.trackName+' — '+song.artistName;
 audio.play().catch(()=>{message.textContent='Play button dabao to preview shuru karo.';});
 document.getElementById('playBtn').textContent='⏸ Pause';
}

function togglePlay(){
 if(!audio.src){message.textContent='Pehle koi song select karo.';return;}
 if(audio.paused){
  audio.play();
  document.getElementById('playBtn').textContent='⏸ Pause';
 }else{
  audio.pause();
  document.getElementById('playBtn').textContent='▶ Play';
 }
}

function nextSong(){
 if(!songs.length)return;
 let i=current;
 for(let n=0;n<songs.length;n++){
  i=(i+1)%songs.length;
  if(songs[i].previewUrl){playSong(songs[i]);return;}
 }
 message.textContent='Agla preview available nahi.';
}

function previousSong(){
 if(!songs.length)return;
 let i=current<0?0:current;
 for(let n=0;n<songs.length;n++){
  i=(i-1+songs.length)%songs.length;
  if(songs[i].previewUrl){playSong(songs[i]);return;}
 }
}

function toggleFavourite(song){
 const i=favourites.findIndex(x=>x.trackId===song.trackId);
 if(i>=0)favourites.splice(i,1);
 else favourites.push(song);
 localStorage.setItem('jammyFavs',JSON.stringify(favourites));
 if(libraryMode)showFavourites();
 else renderSongs(songs);
}

function showFavourites(){
 libraryMode=true;
 document.getElementById('heading').textContent='❤️ My Library';
 results.innerHTML='';
 message.textContent='Tumhare saved songs';
 renderSongs(favourites);
}

audio.addEventListener('ended',nextSong);
search.addEventListener('keydown',e=>{if(e.key==='Enter')findMusic();});
</script>
</body>
</html>
