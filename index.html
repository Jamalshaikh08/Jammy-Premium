<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>MUSIC WITH JAMMY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;padding-bottom:100px}
header{padding:24px 18px;display:flex;align-items:center;gap:12px}
.logo{background:#1ed760;color:#071008;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;font-size:28px}
.brand{font-weight:900;letter-spacing:1px}
h2{font-size:23px;margin:25px 18px 15px}
.categories{display:flex;gap:9px;padding:0 18px;overflow:auto}
.pill{background:#252525;padding:11px 18px;border-radius:30px;white-space:nowrap;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.tile{background:#242424;border-radius:6px;display:flex;align-items:center;gap:10px;overflow:hidden;font-weight:bold;font-size:13px}
.tile img{width:65px;height:65px;object-fit:cover}
.cards{display:flex;gap:15px;overflow:auto;padding:0 18px}
.card{min-width:145px;width:145px}
.card img{width:145px;height:145px;object-fit:cover;border-radius:8px}
.card p{color:#aaa;font-size:12px}
.search{margin:0 18px;background:white;color:black;border-radius:8px;padding:14px}
.search input{border:0;outline:0;width:100%;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:#101010;display:flex;justify-content:space-around;padding:14px 5px 20px}
nav div{text-align:center;color:#aaa;font-size:11px}
nav b{display:block;font-size:22px;margin-bottom:4px}
.active{color:#1ed760}
.player{position:fixed;bottom:68px;left:8px;right:8px;background:#292929;border-radius:8px;padding:12px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
<div class="logo">♫</div>
<div class="brand">MUSIC WITH JAMMY</div>
</header>

<div class="categories">
<div class="pill">All</div>
<div class="pill">Music</div>
<div class="pill">Podcasts</div>
<div class="pill">Videos</div>
</div>

<h2>Good evening 👋</h2>
<div class="grid">
<div class="tile">❤️ Liked Songs</div>
<div class="tile">🔥 Top Hits</div>
<div class="tile">🎧 Daily Mix</div>
<div class="tile">✨ Discover</div>
</div>

<h2>Made For You</h2>
<div class="cards">
<div class="card">
<img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=300">
<b>Daily Vibes</b><p>Your daily music mix</p>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300">
<b>Top Hits</b><p>Popular music</p>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=300">
<b>Chill Mix</b><p>Relax and enjoy</p>
</div>
</div>

<h2>Discover Music</h2>
<div class="search">
<input type="search" placeholder="Search songs and artists...">
</div>

<div class="player">
<span>♫ &nbsp; MUSIC WITH JAMMY</span>
<span>▶</span>
</div>

<nav>
<div class="active"><b>⌂</b>Home</div>
<div><b>⌕</b>Search</div>
<div><b>▤</b>Library</div>
<div><b>◉</b>Profile</div>
</nav>
</body>
</html>
